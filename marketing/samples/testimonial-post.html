<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Cairo",sans-serif}
.post{width:1080px;height:1080px;background:#0F766E;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:110px 100px}
.post::before{content:"";position:absolute;width:760px;height:760px;border-radius:50%;background:#0b5a54;left:-260px;bottom:-300px}
.post::after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;border:2px solid rgba(255,255,255,.14);right:-120px;top:-120px}
.inner{position:relative;z-index:1}
.stars{font-size:54px;letter-spacing:8px;color:#fbbf24;margin-bottom:36px}
.q{font-size:80px;line-height:1;opacity:.35;font-weight:800;margin-bottom:-10px}
blockquote{margin:0;font-size:62px;line-height:1.45;font-weight:800;text-wrap:balance}
.who{margin-top:44px;font-size:30px;font-weight:600;opacity:.9}
.score{display:inline-block;margin-top:18px;background:#fff;color:#0F766E;font-weight:800;font-size:30px;border-radius:999px;padding:6px 26px}
.brand{position:absolute;left:100px;bottom:80px;z-index:1;font-size:30px;font-weight:700;direction:ltr;opacity:.95}
.brand b{font-size:40px;display:block;direction:rtl;text-align:left}
</style></head><body>
<div class="post"><div class="inner">
  <div class="stars">★★★★★</div>
  <div class="q">”</div>
  <blockquote>فاتورتي سهلة وواضحة ونظيفة للعين، وصارت فواتيري بروفشنال أكثر.</blockquote>
  <div class="who">— عميلة فاتورتي</div>
  <div class="score">10/10</div>
</div>
<div class="brand"><b>فاتورتي</b>getfatoorati.com</div>
</div></body></html>
